[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phimirrorhex"
version = "0.16.0"
description = "A reproducible sixfold topology and audit-scheduling research prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MichaelWave369"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["phimirrorhex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
