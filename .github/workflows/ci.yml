name: Hex Research Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Check mathematical contracts and controls
        run: python -m pytest -q
      - name: Verify CLI produces JSON
        run: python -m phimirrorhex --budget 144 --seed 369 > e1-report.json
      - name: Generate deterministic E2 fixture
        run: python -m phimirrorhex --mode e2 --steps 24 --seed 369 --output e2-report.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Python / JavaScript frame and edge parity
        run: node tests/check-parity.mjs e2-report.json
      - name: Freeze E4 Python witness parity suite
        run: python -m phimirrorhex --mode vessel-fixtures --output e4-vessel-fixture.json
      - name: Verify 80 Python / JavaScript E4 witness cases
        run: node tests/check-vessel-parity.mjs e4-vessel-fixture.json
      - name: Generate E5 coupled-gear frozen scenarios
        run: python -m phimirrorhex --mode gears-fixtures --output e5-gears-fixture.json
      - name: Verify 32 Python / JavaScript E5 coupled-gear reports
        run: node tests/check-gears-parity.mjs e5-gears-fixture.json
      - name: Generate E6 cross-scale coherence benchmark
        run: python -m phimirrorhex --mode coherence --output e6-coherence-fixture.json
      - name: Verify Python / JavaScript held-out benchmark parity
        run: node tests/check-coherence-parity.mjs e6-coherence-fixture.json
      - name: Generate E7 adaptive learning benchmark
        run: python -m phimirrorhex --mode adaptive --output e7-adaptive-fixture.json
      - name: Verify independent Python and JavaScript adaptive learning
        run: node tests/check-adaptive-parity.mjs e7-adaptive-fixture.json
      - name: Generate frozen E8 robustness benchmark
        run: python -m phimirrorhex --mode robustness --output e8-robustness-fixture.json
      - name: Verify E8 shifted-domain Python and JavaScript parity
        run: node tests/check-robustness-parity.mjs e8-robustness-fixture.json
      - name: Generate exhaustive E9 observability frontier
        run: python -m phimirrorhex --mode frontier --output e9-frontier-fixture.json
      - name: Verify Python and JavaScript E9 sensor census parity
        run: node tests/check-frontier-parity.mjs e9-frontier-fixture.json
      - name: Generate frozen E10 independent generalization holdout
        run: python -m phimirrorhex --mode generalize --output e10-generalization-fixture.json
      - name: Verify E10 Python and JavaScript sealed policy parity
        run: node tests/check-generalization-parity.mjs e10-generalization-fixture.json
      - name: Generate E11 five-seed replication and failure ledger
        run: python -m phimirrorhex --mode replicate --output e11-replication-fixture.json
      - name: Verify Python and JavaScript E11 full-ledger parity
        run: node tests/check-replication-parity.mjs e11-replication-fixture.json
      - name: Generate E12 sealed sensor economy transfer benchmark
        run: python -m phimirrorhex --mode transfer --output e12-transfer-fixture.json
      - name: Verify Python and JavaScript E12 transfer gate and failure parity
        run: node tests/check-transfer-parity.mjs e12-transfer-fixture.json
      - name: Generate E13 noise calibration and refusal ledger
        run: python -m phimirrorhex --mode calibrate --output e13-calibration-fixture.json
      - name: Verify independent Python and JavaScript E13 calibration parity
        run: node tests/check-calibration-parity.mjs e13-calibration-fixture.json
      - name: Generate E14 sealed drift and shadow calibration ledger
        run: python -m phimirrorhex --mode drift --output e14-drift-fixture.json
      - name: Verify E14 independent Python JavaScript monitor and failure parity
        run: node tests/check-drift-parity.mjs e14-drift-fixture.json
      - name: Generate E15 sealed sequential warning and refusal ledger
        run: python -m phimirrorhex --mode sequential --output e15-sequential-fixture.json
      - name: Verify Python and JavaScript E15 sequential frame and failure parity
        run: node tests/check-sequential-parity.mjs e15-sequential-fixture.json
      - name: Generate E16 correlated Keyhole quorum and refusal ledger
        run: python -m phimirrorhex --mode consensus --output e16-consensus-fixture.json
      - name: Verify E16 independent Python JavaScript full quorum parity
        run: node tests/check-consensus-parity.mjs e16-consensus-fixture.json
      - name: Generate E17 fresh out-of-family consensus transfer fixture
        run: python -m phimirrorhex --mode consensus-transfer --output e17-consensus-transfer-fixture.json
      - name: Verify E17 independently implemented Python and JavaScript full transfer parity
        run: node tests/check-consensus-transfer-parity.mjs e17-consensus-transfer-fixture.json
      - name: Generate E18 sealed prospective quorum audit
        run: python -m phimirrorhex --mode prospective-audit --output e18-prospective-audit-fixture.json
      - name: Verify E18 independent Python JavaScript selection and full audit parity
        run: node tests/check-prospective-audit-parity.mjs e18-prospective-audit-fixture.json
      - name: Generate E19 portable nonauthorizing research evidence
        run: python -m phimirrorhex --mode portable-evidence --output e19-portable-evidence.json
      - name: Verify E19 independent browser and Python packet, SHA-256 and tamper barriers
        run: node tests/check-portable-evidence-parity.mjs e19-portable-evidence.json
      - name: Generate E20 governed receiver nine-case qualification
        run: python -m phimirrorhex --mode receiver-qualification --output e20-receiver-qualification.json
      - name: Verify E20 independent JavaScript Python quarantine and refusal parity
        run: node tests/check-receiver-parity.mjs e20-receiver-qualification.json
      - name: Generate E21 hash-linked intake and replay qualification
        run: python -m phimirrorhex --mode intake-chain --output e21-intake-chain.json
      - name: Verify E21 full Python and JavaScript intake-chain decision parity
        run: node tests/check-intake-chain-parity.mjs e21-intake-chain.json
      - name: Generate E22 offline checkpoint and rollback audit
        run: python -m phimirrorhex --mode checkpoint --output e22-checkpoint-qualification.json
      - name: Verify E22 independent Python JavaScript rollback fork blindspot parity
        run: node tests/check-checkpoint-parity.mjs e22-checkpoint-qualification.json
      - name: Generate E23 local witness and split-view qualification
        run: python -m phimirrorhex --mode witness --output e23-witness-qualification.json
      - name: Verify E23 complete Python and JavaScript witness decision parity
        run: node tests/check-witness-parity.mjs e23-witness-qualification.json
      - name: Generate E24 Ed25519 public-fixture signature qualification
        run: python -m phimirrorhex --mode signed-witness --output e24-signature-qualification.json
      - name: Verify E24 independent Python and browser WebCrypto Ed25519 parity
        run: node tests/check-signature-parity.mjs e24-signature-qualification.json
      - name: Generate E25 two-key lifecycle and state reset qualification
        run: python -m phimirrorhex --mode lifecycle --output e25-key-lifecycle.json
      - name: Verify E25 independent Python WebCrypto dual-signature and replay parity
        run: node tests/check-lifecycle-parity.mjs e25-key-lifecycle.json
      - name: Upload reproducibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: e1-report-py${{ matrix.python-version }}
          path: |
            e1-report.json
            e2-report.json
            e4-vessel-fixture.json
            e5-gears-fixture.json
            e6-coherence-fixture.json
            e7-adaptive-fixture.json
            e8-robustness-fixture.json
            e9-frontier-fixture.json
            e10-generalization-fixture.json
            e11-replication-fixture.json
            e12-transfer-fixture.json
            e13-calibration-fixture.json
            e14-drift-fixture.json
            e15-sequential-fixture.json
            e16-consensus-fixture.json
            e17-consensus-transfer-fixture.json
            e18-prospective-audit-fixture.json
            e19-portable-evidence.json
            e20-receiver-qualification.json
            e21-intake-chain.json
            e22-checkpoint-qualification.json
            e23-witness-qualification.json
            e24-signature-qualification.json
            e25-key-lifecycle.json
